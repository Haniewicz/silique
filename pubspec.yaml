name: silique
description: "Prywatne notatki Markdown. Offline-first, szyfrowane vaulty i synchronizacja E2EE."
publish_to: 'none'
version: 0.2.51+60

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  cryptography: ^2.9.0
  desktop_drop: ^0.8.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  livemd_flutter:
    path: vendor/livemd_flutter
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.7.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  win32: ^6.4.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    # Bundled monospace for code blocks/spans: the generic 'monospace' family
    # resolves on Android/macOS but not deterministically on Linux clients
    # (tofu boxes). Roboto Mono (OFL, see assets/fonts/OFL-RobotoMono.txt)
    # matches the Android system mono, keeping code rendering consistent.
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
