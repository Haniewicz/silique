name: App checks and packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libssl-dev
      - run: flutter pub get
      - run: flutter build ${{ matrix.platform }} --release
      - if: matrix.platform == 'macos'
        run: |
          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Silique.app" packages/Silique-macOS.zip
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath packages/Silique-Windows.zip
      - if: matrix.platform == 'linux'
        run: |
          mkdir -p packages
          tar -czf packages/Silique-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: silique-${{ matrix.platform }}
          path: packages/*
          retention-days: 30
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Restore Android release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          echo "$KEYSTORE" | base64 --decode > android/app/silique-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=nova-notes\nstoreFile=silique-release.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: silique-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
